<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Clipper for Google Drive</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <div class="logo">
      <div class="logo-icon"></div>
      <span>Magic Clipper<br><small>for Google Drive</small></span>
    </div>
    <div id="auth-status" class="status-badge status-loading">Connexion...</div>
  </header>

  <!-- FICHIER DÉTECTÉ -->
  <section class="file-section">
    <label>Fichier détecté</label>
    <div id="file-info" class="file-info">
      <span class="file-icon">📄</span>
      <span id="file-name" class="file-name">Analyse en cours…</span>
    </div>
  </section>

  <!-- ACTION PRINCIPALE -->
  <section class="action-section">
    <button id="upload-btn" class="btn primary-btn" disabled>
      <span class="btn-text">⬆️ Envoyer vers Google Drive</span>
      <span id="btn-spinner" class="spinner hidden"></span>
    </button>
    <div id="drive-link-row" class="drive-link-row hidden">
      <a id="drive-link" href="#" target="_blank">📂 Voir dans Google Drive</a>
    </div>
  </section>

  <!-- STATUT -->
  <footer class="app-footer">
    <div id="status-message" class="status-message">Prêt</div>
  </footer>

  <!-- DÉCONNEXION -->
  <button id="disconnect-btn" class="btn close-btn">Déconnecter</button>

  <script src="popup.js"></script>
</body>
</html>
